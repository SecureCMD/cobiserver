services:
  koserver:
    build: .
    image: cobiserver/koserver:latest
    container_name: koserver
    restart: unless-stopped
    ports:
      - "8080:8080"
    # Copy .env.example to .env and uncomment this to load overrides from
    # it (compose errors if the file doesn't exist, so it's opt-in here).
    # env_file:
    #   - .env
    environment:
      LISTEN_ADDR: ":8080"
      DATA_DIR: "/data"
      # Public URL clients/browsers use to reach this server. Used to build
      # password-reset links, so keep it accurate.
      BASE_URL: "http://localhost:8080"
      # Allow the KOReader app's built-in "Register" button (and the web
      # /account/register page) to create new accounts. Set to "false" and
      # create users with `docker compose exec koserver koserver create-user`
      # if you'd rather manage accounts yourself.
      ALLOW_SIGNUP: "true"
      # Set to "true" once this is served over HTTPS (e.g. behind a reverse
      # proxy) so session cookies get the Secure flag.
      COOKIE_SECURE: "false"
      # Set to "true" only if a trusted reverse proxy sets X-Forwarded-For.
      TRUST_PROXY_HEADERS: "false"
    volumes:
      - koserver-data:/data

volumes:
  koserver-data:
