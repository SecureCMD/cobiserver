<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Reset password · KOReader Sync</title>
<link rel="stylesheet" href="/static/style.css">
</head>
<body>
<div class="wrap">
	<h1>Reset password</h1>
	<div class="card">
		{{if .Error}}<div class="msg error">{{.Error}}</div>{{end}}
		<form method="post" action="/account/reset-password">
			<input type="hidden" name="token" value="{{.Token}}">
			<label for="new_password">New password</label>
			<input type="password" id="new_password" name="new_password" autocomplete="new-password" required minlength="4">
			<label for="new_password2">Confirm new password</label>
			<input type="password" id="new_password2" name="new_password2" autocomplete="new-password" required minlength="4">
			<button type="submit">Set new password</button>
		</form>
	</div>
</div>
</body>
</html>
