<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Forgot password · KOReader Sync</title>
<link rel="stylesheet" href="/static/style.css">
</head>
<body>
<div class="wrap">
	<h1>Forgot password</h1>
	<p class="sub">Enter your username. If an email is on file and outgoing mail is configured, we'll send you a reset link. Otherwise, ask the server administrator to run <code>koserver gen-reset-link -username &lt;name&gt;</code>.</p>
	<div class="card">
		{{if .Error}}<div class="msg error">{{.Error}}</div>{{end}}
		{{if .Info}}<div class="msg ok">{{.Info}}</div>{{end}}
		<form method="post" action="/account/forgot-password">
			<label for="username">Username</label>
			<input type="text" id="username" name="username" autocomplete="username" required>
			<button type="submit">Request reset</button>
		</form>
		<div class="links"><a href="/account/login">Back to sign in</a></div>
	</div>
</div>
</body>
</html>
