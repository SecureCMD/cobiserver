<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Change password · KOReader Sync</title>
<link rel="stylesheet" href="/static/style.css">
</head>
<body>
<div class="wrap">
	<h1>Change password</h1>
	<p class="sub">Changing your password here also updates it for the KOReader app — re-enter it there afterwards.</p>
	<div class="card">
		{{if .Error}}<div class="msg error">{{.Error}}</div>{{end}}
		{{if .Info}}<div class="msg ok">{{.Info}}</div>{{end}}
		<form method="post" action="/account/change-password">
			<label for="current_password">Current password</label>
			<input type="password" id="current_password" name="current_password" autocomplete="current-password" required>
			<label for="new_password">New password</label>
			<input type="password" id="new_password" name="new_password" autocomplete="new-password" required minlength="4">
			<label for="new_password2">Confirm new password</label>
			<input type="password" id="new_password2" name="new_password2" autocomplete="new-password" required minlength="4">
			<button type="submit">Update password</button>
		</form>
		<div class="links"><a href="/account">Back to account</a></div>
	</div>
</div>
</body>
</html>
