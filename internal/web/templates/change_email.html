<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Recovery email · KOReader Sync</title>
<link rel="stylesheet" href="/static/style.css">
</head>
<body>
<div class="wrap">
	<h1>Recovery email</h1>
	<p class="sub">Used only to send you a password reset link if you forget your password.</p>
	<div class="card">
		{{if .Error}}<div class="msg error">{{.Error}}</div>{{end}}
		{{if .Info}}<div class="msg ok">{{.Info}}</div>{{end}}
		<form method="post" action="/account/change-email">
			<label for="email">Email</label>
			<input type="email" id="email" name="email" value="{{.User.Email}}" autocomplete="email">
			<button type="submit">Save</button>
		</form>
		<div class="links"><a href="/account">Back to account</a></div>
	</div>
</div>
</body>
</html>
